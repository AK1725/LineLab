# Infrastructure:   docker compose up -d
# Infra + apps:     docker compose --profile apps up -d --build
# Dev credentials only. Never reuse them in production.

name: linelab

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: linelab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linelab}
      POSTGRES_DB: linelab
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linelab -d linelab"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage (uploads, models, firmware binaries). See docs/adr/0002.
  seaweedfs:
    image: chrislusf/seaweedfs:4.55
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    ports: ["8333:8333"]
    volumes:
      - seaweedfs-data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

  seaweedfs-init:
    image: chrislusf/seaweedfs:4.55
    depends_on:
      seaweedfs: { condition: service_healthy }
    entrypoint:
      - /bin/sh
      - -c
      - echo "s3.bucket.create -name linelab" | weed shell -master=seaweedfs:9333
    restart: "no"

  api:
    profiles: [apps]
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      API_PORT: "4000"
      DATABASE_URL: postgres://linelab:${POSTGRES_PASSWORD:-linelab}@postgres:5432/linelab
      REDIS_URL: redis://redis:6379
      # AI debugger: the server's key (optional; users can bring their own per session).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LINELAB_AGENT_MODEL: ${LINELAB_AGENT_MODEL:-claude-opus-5-5}
      COMPILER_URL: http://compiler:8100
      LINELAB_COMPILE_CACHE: /tmp/compile-cache
      LINELAB_KB_SEED: /app/seed/knowledge-seed.json
      # Sign-in for the gallery. The default secret is for local use only: set your own
      # (openssl rand -hex 32) in .env for anything reachable by others.
      AUTH_SECRET: ${AUTH_SECRET:-local-dev-only-secret-change-me-0123456789abcdef}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      # Email sign-in: sent by SMTP when SMTP_URL is set (e.g. smtps://user:pass@smtp.host:465),
      # otherwise printed in this service's log (docker compose logs api).
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-LineLab <no-reply@localhost>}
      LINELAB_MAIL: log
      # Knowledge-base search by meaning (bge-small in the vision service).
      EMBEDDINGS_URL: http://vision:8000
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    ports: ["4000:4000"]
    networks: [default, sandbox]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      compiler: { condition: service_started }
      vision: { condition: service_started }

  vision:
    profiles: [apps]
    build: { context: ., dockerfile: apps/vision/Dockerfile }
    ports: ["8000:8000"]

  web:
    profiles: [apps]
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports: ["3000:3000"]
    environment:
      VISION_URL: http://vision:8000
      COMPILER_URL: http://compiler:8100
      API_URL: http://api:4000
    networks: [default, sandbox]
    depends_on: [api, vision, compiler]

  # Firmware compiler: untrusted code, so no internet (internal-only network), 1 GB, 2 CPUs,
  # read-only root, no capabilities, non-root. Each job also has a 60 s timeout and prlimits.
  compiler:
    profiles: [apps]
    build: { context: ., dockerfile: apps/compiler/Dockerfile }
    networks: [sandbox]
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    read_only: true
    tmpfs: ["/tmp:rw,size=512m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  default: {}
  # No route to the outside world: only the web app can reach the compiler.
  sandbox:
    internal: true

volumes:
  postgres-data:
  redis-data:
  seaweedfs-data:
