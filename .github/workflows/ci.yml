name: CI

on:
  # Every pushed branch (each phase lives on its own branch) and every pull request.
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"
  # The vision embedding tests must run here (they download bge-small, ~65 MB).
  LINELAB_REQUIRE_EMBED_MODEL: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Lint, typecheck, test, validate, build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/vision/uv.lock
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked
        working-directory: apps/vision
      - run: pnpm verify
      - name: Simulator speed (must stay ≥ 20× real time)
        run: pnpm bench:sim

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @linelab/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  docker:
    name: Compose config and images build
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --profile apps config --quiet
      - run: docker compose --profile apps build
      - name: Compiler sandbox (no network, 60 s and 1 GB limits, offline toolchains)
        run: apps/compiler/scripts/sandbox-check.sh
